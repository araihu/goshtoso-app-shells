name: Update Arai Hu fallback assets

on:
  repository_dispatch:
    types: [araihu-assets-released]
  workflow_dispatch:
    inputs:
      assets_repository:
        description: Release repository
        required: true
        default: araihu/assets
        type: string
      assets_revision:
        description: Full release commit SHA
        required: true
        type: string
      release:
        description: Stable release tag (vX.Y.Z)
        required: true
        type: string
      release_url:
        description: Immutable tar.gz release URL
        required: true
        type: string
      release_sha256:
        description: Release archive SHA-256
        required: true
        type: string
      release_json_sha256:
        description: release.json SHA-256
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: araihu-assets-${{ github.event.client_payload.release || inputs.release }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: [self-hosted, Linux, X64, hostinger-vps-trusted]
    env:
      DAGGER_VERSION: '0.21.8'
      RUN_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}
      ASSETS_REPOSITORY: ${{ github.event.client_payload.assets_repository || inputs.assets_repository }}
      ASSETS_REVISION: ${{ github.event.client_payload.assets_revision || inputs.assets_revision }}
      RELEASE: ${{ github.event.client_payload.release || inputs.release }}
      RELEASE_URL: ${{ github.event.client_payload.release_url || inputs.release_url }}
      RELEASE_SHA256: ${{ github.event.client_payload.release_sha256 || inputs.release_sha256 }}
      RELEASE_JSON_SHA256: ${{ github.event.client_payload.release_json_sha256 || inputs.release_json_sha256 }}
    steps:
      - name: Check out Goshtoso App Shells
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate and seal immutable release identity
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CLIENT_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          set -euo pipefail
          if test "$EVENT_NAME" = repository_dispatch; then
            jq --exit-status '
              keys == [
                "assets_repository",
                "assets_revision",
                "release",
                "release_json_sha256",
                "release_sha256",
                "release_url"
              ]
            ' <<< "$CLIENT_PAYLOAD" >/dev/null
          fi
          test "$ASSETS_REPOSITORY" = araihu/assets
          [[ "$ASSETS_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$RELEASE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$RELEASE_JSON_SHA256" =~ ^[0-9a-f]{64}$ ]]
          expected_url="https://github.com/araihu/assets/releases/download/${RELEASE}/araihu-assets-${RELEASE}.tar.gz"
          test "$RELEASE_URL" = "$expected_url"

          install -d -m 0700 .dagger-input
          jq --null-input \
            --arg assets_repository "$ASSETS_REPOSITORY" \
            --arg assets_revision "$ASSETS_REVISION" \
            --arg release "$RELEASE" \
            --arg release_url "$RELEASE_URL" \
            --arg release_sha256 "$RELEASE_SHA256" \
            --arg release_json_sha256 "$RELEASE_JSON_SHA256" \
            '{assets_repository: $assets_repository, assets_revision: $assets_revision,
              release: $release, release_url: $release_url,
              release_sha256: $release_sha256,
              release_json_sha256: $release_json_sha256}' \
            > .dagger-input/assets-payload.json

      - name: Install pinned Dagger on GitHub-hosted runner
        if: runner.environment == 'github-hosted'
        uses: dagger/dagger-for-github@456fc3af63a2ba6f9789af9c55045b459115541b # v8.3.0
        with:
          version: ${{ env.DAGGER_VERSION }}

      - name: Verify exact Dagger version
        shell: bash
        run: |
          set -euo pipefail
          expected="v${DAGGER_VERSION}"
          actual="$(dagger version | awk 'NR == 1 { print $2 }')"
          test "$actual" = "$expected"

      - name: Verify and update fallback assets with Dagger
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          dagger call assets-update
          --source=.
          --payload=.dagger-input/assets-payload.json
          --github-token=env://GH_TOKEN
          --cache-namespace=trusted
          --run-nonce="$RUN_NONCE"
          export --path=.dagger-output/assets

      - name: Materialize allowlisted fallback assets
        shell: bash
        run: |
          set -euo pipefail
          allowlisted=(
            araihu-assets.json
            componentdocshell/assets/araihu.css
            componentdocshell/assets/goshtoso-favicon.svg
            componentdocshell/assets/goshtoso-logo.svg
            componentdocshell/assets/goshtoso-mark-reverse.svg
            componentdocshell/assets/goshtoso-mark.svg
          )
          for path in "${allowlisted[@]}"; do
            test -f ".dagger-output/assets/$path"
            cp ".dagger-output/assets/$path" "$path"
          done

      - name: Create selected-repository App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.ARAIHU_ASSETS_APP_ID }}
          private-key: ${{ secrets.ARAIHU_ASSETS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: goshtoso-app-shells
          permission-contents: write
          permission-pull-requests: write
          permission-issues: read

      - name: Select existing labels only
        id: labels
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          available=$(gh label list --repo "$GITHUB_REPOSITORY" --limit 1000 \
            --json name --jq '.[].name')
          selected=""
          for label in dependencies assets; do
            if grep --fixed-strings --line-regexp --quiet "$label" <<< "$available"; then
              selected+="${selected:+$'\n'}$label"
            fi
          done
          {
            echo 'labels<<EOF'
            printf '%s\n' "$selected"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create or update fallback asset PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: automation/araihu-assets-${{ env.RELEASE }}
          base: main
          delete-branch: false
          commit-message: 'build(assets): update Arai Hu fallbacks to ${{ env.RELEASE }}'
          title: 'build(assets): update Arai Hu fallbacks to ${{ env.RELEASE }}'
          body: |
            Automated fallback refresh from immutable `araihu/assets` release `${{ env.RELEASE }}`.

            - Revision: `${{ env.ASSETS_REVISION }}`
            - Archive SHA-256: `${{ env.RELEASE_SHA256 }}`
            - `release.json` SHA-256: `${{ env.RELEASE_JSON_SHA256 }}`

            This workflow never auto-merges.
          labels: ${{ steps.labels.outputs.labels }}
          add-paths: |
            araihu-assets.json
            componentdocshell/assets/araihu.css
            componentdocshell/assets/goshtoso-favicon.svg
            componentdocshell/assets/goshtoso-logo.svg
            componentdocshell/assets/goshtoso-mark-reverse.svg
            componentdocshell/assets/goshtoso-mark.svg
