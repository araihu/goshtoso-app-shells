name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: >-
      ${{
        github.event_name == 'pull_request' &&
        contains(fromJSON('["opened","synchronize","reopened","ready_for_review"]'), github.event.action) &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.user.login == github.actor &&
        github.event.pull_request.base.repo.full_name == github.repository &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.repo.fork == false &&
        contains(fromJSON(vars.HOSTINGER_PR_ACTORS_JSON || '[]'), github.actor) &&
        fromJSON('["self-hosted","Linux","X64","hostinger-vps"]') ||
        'ubuntu-latest'
      }}
    env:
      DAGGER_VERSION: '0.21.8'
      RUN_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}
      TRUST_DOMAIN: >-
        ${{
          github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && 'fork' ||
          github.event_name == 'pull_request' && 'internal' ||
          github.ref == 'refs/heads/main' && 'main' ||
          'branch'
        }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Dagger on GitHub-hosted runner
        if: runner.environment == 'github-hosted'
        uses: dagger/dagger-for-github@456fc3af63a2ba6f9789af9c55045b459115541b # v8.3.0
        with:
          version: ${{ env.DAGGER_VERSION }}

      - name: Verify exact Dagger version
        shell: bash
        run: |
          set -euo pipefail
          expected="v${DAGGER_VERSION}"
          actual="$(dagger version | awk 'NR == 1 { print $2 }')"
          test "$actual" = "$expected"

      - name: Generate, test, vet, and build
        shell: bash
        run: >-
          dagger call ci
          --source=.
          --trust-domain="$TRUST_DOMAIN"
          --run-nonce="$RUN_NONCE"

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DAGGER_VERSION: '0.21.8'
      RUN_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}-browser
      TRUST_DOMAIN: >-
        ${{
          github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && 'fork' ||
          github.event_name == 'pull_request' && 'internal' ||
          github.ref == 'refs/heads/main' && 'main' ||
          'branch'
        }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Dagger
        uses: dagger/dagger-for-github@456fc3af63a2ba6f9789af9c55045b459115541b # v8.3.0
        with:
          version: ${{ env.DAGGER_VERSION }}

      - name: Verify exact Dagger version
        shell: bash
        run: |
          set -euo pipefail
          expected="v${DAGGER_VERSION}"
          actual="$(dagger version | awk 'NR == 1 { print $2 }')"
          test "$actual" = "$expected"

      - name: Test component docs shell browser behavior
        shell: bash
        run: >-
          dagger call browser
          --source=.
          --trust-domain="$TRUST_DOMAIN"
          --run-nonce="$RUN_NONCE"
