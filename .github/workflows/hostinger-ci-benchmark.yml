name: Hostinger CI benchmark

on:
  push:
    branches:
      - codex/hostinger-ci-benchmark
    paths:
      - .github/workflows/hostinger-ci-benchmark.yml
      - scripts/ci-hostinger-benchmark.sh
      - scripts/check-dagger-contract.sh
      - scripts/dagger/**
      - dagger.json
      - .dagger/**

permissions:
  contents: read

concurrency:
  group: goshtoso-app-shells-hostinger-ci-benchmark
  cancel-in-progress: false

jobs:
  github-hosted:
    name: GitHub-hosted identical workload
    if: >-
      github.event_name == 'push' &&
      github.repository == 'araihu/goshtoso-app-shells' &&
      github.actor == 'guilycst' &&
      github.ref == 'refs/heads/codex/hostinger-ci-benchmark' &&
      github.event.repository.fork == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DAGGER_VERSION: '0.21.8'
      RUN_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}-github-hosted
    steps:
      - name: Check out exact benchmark commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned Dagger on GitHub-hosted runner
        if: runner.environment == 'github-hosted'
        uses: dagger/dagger-for-github@456fc3af63a2ba6f9789af9c55045b459115541b # v8.3.0
        with:
          version: ${{ env.DAGGER_VERSION }}
      - name: Verify exact Dagger version
        shell: bash
        run: |
          set -euo pipefail
          expected="v${DAGGER_VERSION}"
          actual="$(dagger version | awk 'NR == 1 { print $2 }')"
          test "$actual" = "$expected"
      - name: Run identical workload
        shell: bash
        run: >-
          dagger call benchmark
          --source=.
          --cache-namespace=benchmark-hosted
          --run-nonce="$RUN_NONCE"

  hostinger:
    name: Hostinger identical workload
    if: >-
      github.event_name == 'push' &&
      github.repository == 'araihu/goshtoso-app-shells' &&
      github.actor == 'guilycst' &&
      github.ref == 'refs/heads/codex/hostinger-ci-benchmark' &&
      github.event.repository.fork == false
    runs-on: [self-hosted, Linux, X64, hostinger-vps-trusted]
    timeout-minutes: 10
    env:
      DAGGER_VERSION: '0.21.8'
      RUN_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}-hostinger
    steps:
      - name: Check out exact benchmark commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact embedded Dagger version
        shell: bash
        run: |
          set -euo pipefail
          expected="v${DAGGER_VERSION}"
          actual="$(dagger version | awk 'NR == 1 { print $2 }')"
          test "$actual" = "$expected"
      - name: Run identical workload
        shell: bash
        run: >-
          dagger call benchmark
          --source=.
          --cache-namespace=trusted
          --run-nonce="$RUN_NONCE"
